# CI（BL-008・BL-080。infra.md §4-3・付録 A-1 を npm に読み替えたもの）
# - verify: gitleaks → lint → typecheck → test → test:checks → build:all → build:e2e → check:size → check:assets → check:text
#     → （dist/web をデプロイのジョブに渡す）→ check-e2e-dist → Playwright → test:e2e
#   同じジョブの連続した step なので、前が失敗したら後ろは動かない（TS-008-23）。E2E は前の e2e ジョブをこのジョブに入れたもの
#   （Actions の分数の削減 A1。org/10_development/devops/2026-09-29_actions-minutes.md。npm ci などの重複・dist-e2e の受け渡し・
#   1 分単位の切り上げの損を 2 回 → 1 回に減らす）。PR・手動実行・main への push のすべてで E2E まで動く（決定 0007: main の push
#   でも PR と同じ npm run test:e2e を流し、ステージングはその緑を待つ。マージの規則の案 L の前提。QA の条件 1）
# - deploy-preview / deploy-staging: Actions の Variables の CF_PAGES_PROJECT が空のあいだはスキップされる（BL-080 で登録済み）
#   このワークフローは本番ブランチ（main）には決して出さない。本番は release.yml（手動・G3 の後。BL-085）だけ
#   - PR は main をベースにしたものだけ（head が main の PR は同じリポジトリでは作れない）
#   - プレビューは同じリポジトリのブランチからの PR だけ（フォーク・Dependabot には出さない）
#   - プレビューのデプロイの直前に、ブランチ名が 空・main・staging・production（小文字にしたもの、別名にしたもの）なら失敗させる
#   - secrets を参照するのは、デプロイのジョブの中の wrangler pages deploy の step 1 つだけ（PR #28 のレビュー N-1）。
#     pull_request_target・workflow_run は使わない（PR のコードを secrets つきで動かす形になりうる。N-2）
#   - これらは scripts/check-selftest.mjs（npm run test:checks）が静的に検査する（コードレビュー PR #1 の Must）
# - ラベル: このワークフローは labeled では動かない（BL-098）。preview のラベルを付けたときのプレビューは preview.yml
# - サプライチェーン: gitleaks は版と SHA256 を固定した CLI を直接使う（第三者のアクションを動かさない）。
#   wrangler は deploy/package-lock.json で固定し、トークンのない step で npm ci --ignore-scripts する
name: ci

on:
  pull_request:
    branches: [main]
    # labeled は置かない（BL-098。PR #28 のレビュー S-1 (b)）: ラベルを付けるたびに run ができ、preview 以外のラベルでは verify が
    # skip のチェックとして同じ head に並んで、前の run の verify の赤を隠しうるため。ラベルを付けたときのプレビューは preview.yml
    # （ジョブ名 preview-label。同じ head のこのワークフローの verify が success の run の dist-web を出す。verify を回し直さない）
    types: [opened, synchronize, reopened]
    paths-ignore: ['docs/**']
  push:
    branches: [main]
    paths-ignore: ['docs/**']
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  verify:
    # if: を置かない（どのきっかけでも必ず動く。E2E が黙って外れない。BL-098・PR #28 のレビュー S-1 (b)。test:checks が検査する）
    runs-on: ubuntu-latest
    timeout-minutes: 30 # 検査とビルド 約 1.5 分＋test:e2e の step（15）＋準備と失敗したときの記録の保存に 10 分以上（BL-099）
    env:
      PW_CHANNEL: chromium # Playwright の Chromium（BL-073 から playwright.config.ts の既定も chromium。手元で Chrome を使うときだけ chrome）
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # gitleaks が全ブランチの全履歴を走査するため
          persist-credentials: false
      - name: gitleaks（全ブランチの全履歴。-m でマージコミットの差分も見る）
        env:
          GITLEAKS_VERSION: 8.30.1
          # gitleaks_8.30.1_linux_x64.tar.gz の SHA256（公式の gitleaks_8.30.1_checksums.txt と同じ値。2026-09-28 に確認）
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          f="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSLf -o "$RUNNER_TEMP/$f" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$f"
          echo "$GITLEAKS_SHA256  $RUNNER_TEMP/$f" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$f" -C "$RUNNER_TEMP" gitleaks
          # -v: 検出したときに場所（File・Line・Commit・RuleID・Fingerprint）をログに出す。値は --redact で REDACTED になる（BL-098。
          #     --redact を外した -v にはしない。test:checks が検査する）。解除の手順は runbook §9-2
          "$RUNNER_TEMP/gitleaks" git --log-opts="--all -m" --redact -v --no-color --no-banner --exit-code 1 .
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: install
        run: npm ci
      - name: lint
        run: npm run lint
      - name: typecheck
        run: npm run typecheck
      - name: test
        run: npm run test
      - name: test:checks（ビルド検査そのもののテスト）
        run: npm run test:checks
      - name: build:all（web・crazygames・itch・poki）
        run: npm run build:all
      - name: build:e2e（テスト用フック入り）
        run: npm run build:e2e
      - name: check:size
        run: npm run check:size
      - name: check:assets
        run: npm run check:assets
      - name: check:text（文言の検査。BL-077。語のリストは scripts/text-words.json、許可リストは scripts/text-allowlist.json）
        run: npm run check:text
      - name: dist/web をデプロイのジョブに渡す
        uses: actions/upload-artifact@v7
        with:
          name: dist-web
          path: dist/web/
          retention-days: 1
          if-no-files-found: error
      - name: ビルドの確認（E2E が配信する e2e 系 2 種・本番 4 種。欠けていれば Playwright を入れる前に止める）
        run: node scripts/check-e2e-dist.mjs
      # キャッシュ（A3）の守り（PR #28 のレビュー N-4。test:checks が検査する）:
      # - restore-keys を置かない（package-lock.json を戻したときに、古い〔汚れうる〕キャッシュに戻らない）
      # - dist-web の保存はこの step より前（キャッシュから戻したブラウザの実行ファイルが動く前に、デプロイするものを確定する）
      # - 汚染を疑ったら runbook §8 の手順で消す（gh cache list / gh cache delete）
      - name: Playwright のブラウザのキャッシュ（A3。版は package-lock.json の @playwright/test で決まる）
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Playwright の Chromium（キャッシュがあればブラウザの取得は飛ばし、OS の部品だけ入れる）
        run: npx playwright install --with-deps chromium
      - name: test:e2e
        # --project=chromium と prod-builds（PoC の道具と @nightly の印のテストは playwright.config.ts で除外）。配信は e2e/support/serve.mjs が
        # mode（既定 e2e）の outDir（dist/e2e-web）を使う。配信先の上書きの環境変数はここでは渡さない（S2 の mode の切り替えを上書きするため）。
        # 本番の起動の E2E（BL-097）は、手元と同じ dist/web・crazygames・itch・poki を読む前提で test:e2e に含める（step を増やさない）。
        # 別の project・スクリプトにする場合は、ここに 1 行足して注記を直す（実行・修復エンジニアと合わせる。BL-095）
        # timeout-minutes はジョブ（30）より 10 分以上短くする: ジョブのタイムアウトで止まると failure() の step も動かず、記録が何も残らない（BL-099）
        timeout-minutes: 15
        run: npm run test:e2e
      # 失敗したときの記録（BL-099。決定 0006-4・QA 判定書 S1 §6-3。nightly.yml も同じ方針）
      # - playwright-report/ だけを 3 日。HTML レポートがトレース・スクリーンショットを自分の中に写すので、原因はこれで追える
      #   （前は test-results/ も一緒に 7 日保存して同じものを 2 回持っていた。1 回 約 168MB。infra.md §4-3「成果物の保存量」）
      # - test-results/ は HTML レポートができなかったとき（playwright-report/index.html がないとき。step のタイムアウトなど）だけ
      # - 失敗の原因（エラーの要約・分類）は、3 日で消える成果物ではなく実行記録（org/30_quality/test-engineer/runs/）に残す
      - name: 失敗したときの記録を残す（HTML レポート）
        if: failure() && hashFiles('playwright-report/index.html') != ''
        uses: actions/upload-artifact@v7
        with:
          name: e2e-report
          path: playwright-report/
          retention-days: 3
          if-no-files-found: ignore
      - name: 失敗したときの記録を残す（HTML レポートができなかったときだけ test-results/）
        if: failure() && hashFiles('playwright-report/index.html') == ''
        uses: actions/upload-artifact@v7
        with:
          name: e2e-test-results
          path: test-results/
          retention-days: 3
          if-no-files-found: ignore

  deploy-preview:
    needs: verify # E2E は verify の中（A1）。E2E が緑でないとプレビューに出さない
    # preview のラベルの付いた PR だけ（A2。オーナー・QA に URL を渡すときに付ける。1 回 1 分の切り上げの節約）。
    # ここで出すのはラベルを付けた後の push の run。ラベルを付けた時点のプレビューは preview.yml（BL-098）。
    # Dependabot の PR には出さない（人がラベルを付けた run には secrets が渡りうる。PR #28 のレビュー N-2）
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]' && vars.CF_PAGES_PROJECT != '' && contains(github.event.pull_request.labels.*.name, 'preview')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read # deploy/ の lockfile を取る checkout だけに使う
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: deploy
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: deploy/package-lock.json
      - name: wrangler を入れる（deploy/package-lock.json で固定。インストールのスクリプトは動かさず、トークンも渡さない）
        run: npm ci --prefix deploy --ignore-scripts --no-audit --no-fund
      - uses: actions/download-artifact@v8
        with:
          name: dist-web
          path: dist/web/
      - name: Cloudflare Pages（プレビュー https://<branch>.<project>.pages.dev）
        run: |
          # 本番・ステージングの別名と同じ名前、空の名前には出さない（Pages は小文字にし、英数字以外をハイフンにした名前を別名にする）
          lower="$(printf '%s' "$BRANCH" | tr '[:upper:]' '[:lower:]')"
          alias="$(printf '%s' "$lower" | sed -E 's/[^a-z0-9]+/-/g; s/^-+//; s/-+$//')"
          for name in "$lower" "$alias"; do
            case "$name" in
              ''|main|staging|production)
                echo "::error::ブランチ名「$BRANCH」はプレビューに出さない（本番・ステージングの別名と衝突するか、空）"
                exit 1 ;;
            esac
          done
          deploy/node_modules/.bin/wrangler pages deploy dist/web --project-name="$PROJECT" --branch="$BRANCH" --commit-hash="$SHA" --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: 'false'
          PROJECT: ${{ vars.CF_PAGES_PROJECT }}
          BRANCH: ${{ github.head_ref }}
          SHA: ${{ github.event.pull_request.head.sha }}

  deploy-staging:
    needs: verify # E2E は verify の中（A1）。E2E が緑でないとステージングに出さない（決定 0007）
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.CF_PAGES_PROJECT != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read # deploy/ の lockfile を取る checkout だけに使う
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: deploy
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: deploy/package-lock.json
      - name: wrangler を入れる（deploy/package-lock.json で固定。インストールのスクリプトは動かさず、トークンも渡さない）
        run: npm ci --prefix deploy --ignore-scripts --no-audit --no-fund
      - uses: actions/download-artifact@v8
        with:
          name: dist-web
          path: dist/web/
      - name: Cloudflare Pages（ステージング https://staging.<project>.pages.dev。本番ブランチにはしない）
        run: deploy/node_modules/.bin/wrangler pages deploy dist/web --project-name="$PROJECT" --branch=staging --commit-hash="$GITHUB_SHA" --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: 'false'
          PROJECT: ${{ vars.CF_PAGES_PROJECT }}
