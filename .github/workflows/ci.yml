# CI（BL-008・BL-080。infra.md §4-3・付録 A-1 を npm に読み替えたもの）
# - verify: gitleaks → lint → typecheck → test → test:checks → build:all → build:e2e → check:size → check:assets
#   同じジョブの連続した step なので、前が失敗したら後ろは動かない（TS-008-23）
# - e2e: verify が緑のときだけ（needs）。PR と手動実行で動く。main への push では PR で実施済みなので省く
#   verify の e2e 系のビルドを受け取って配信する。web 版の出力先は PoC（main）が dist/e2e、BL-007（S1-core）から dist/e2e-web で、
#   scripts/pick-e2e-dist.mjs が index.html のあるほう（e2e-web を優先）を選ぶ
# - deploy-preview / deploy-staging: Actions の Variables の CF_PAGES_PROJECT が空のあいだはスキップされる（BL-080 で登録済み）
#   このワークフローは本番ブランチ（main）には決して出さない。本番は release.yml（手動・G3 の後。BL-085）だけ
#   - PR は main をベースにしたものだけ（head が main の PR は同じリポジトリでは作れない）
#   - プレビューは同じリポジトリのブランチからの PR だけ（フォーク・Dependabot には出さない）
#   - プレビューのデプロイの直前に、ブランチ名が 空・main・staging・production（小文字にしたもの、別名にしたもの）なら失敗させる
#   - これらは scripts/check-selftest.mjs（npm run test:checks）が静的に検査する（コードレビュー PR #1 の Must）
# - サプライチェーン: gitleaks は版と SHA256 を固定した CLI を直接使う（第三者のアクションを動かさない）。
#   wrangler は deploy/package-lock.json で固定し、トークンのない step で npm ci --ignore-scripts する
name: ci

on:
  pull_request:
    branches: [main]
    paths-ignore: ['docs/**']
  push:
    branches: [main]
    paths-ignore: ['docs/**']
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # gitleaks が全ブランチの全履歴を走査するため
          persist-credentials: false
      - name: gitleaks（全ブランチの全履歴。-m でマージコミットの差分も見る）
        env:
          GITLEAKS_VERSION: 8.30.1
          # gitleaks_8.30.1_linux_x64.tar.gz の SHA256（公式の gitleaks_8.30.1_checksums.txt と同じ値。2026-09-28 に確認）
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          f="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSLf -o "$RUNNER_TEMP/$f" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$f"
          echo "$GITLEAKS_SHA256  $RUNNER_TEMP/$f" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$f" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --log-opts="--all -m" --redact --no-banner --exit-code 1 .
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: install
        run: npm ci
      - name: lint
        run: npm run lint
      - name: typecheck
        run: npm run typecheck
      - name: test
        run: npm run test
      - name: test:checks（ビルド検査そのもののテスト）
        run: npm run test:checks
      - name: build:all（web・crazygames・itch・poki）
        run: npm run build:all
      - name: build:e2e（テスト用フック入り）
        run: npm run build:e2e
      - name: check:size
        run: npm run check:size
      - name: check:assets
        run: npm run check:assets
      - name: dist/web をデプロイのジョブに渡す
        uses: actions/upload-artifact@v7
        with:
          name: dist-web
          path: dist/web/
          retention-days: 1
          if-no-files-found: error
      - name: e2e 系のビルドを e2e のジョブに渡す
        uses: actions/upload-artifact@v7
        with:
          name: dist-e2e
          # web 版は PoC（main）が dist/e2e、BL-007（S1-core）から dist/e2e-web。e2e-poki は PoC だけが作る。
          # ないものは飛ばされる（全部ないときだけ if-no-files-found で失敗）。どれも dist/ からの相対パスで保存される（パスの共通の親が dist/）
          path: |
            dist/e2e/
            dist/e2e-web/
            dist/e2e-crazygames/
            dist/e2e-poki/
          retention-days: 1
          if-no-files-found: error

  e2e:
    needs: verify
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PW_CHANNEL: chromium # ローカルの既定は chrome（インストール済みの Chrome）。CI は Playwright の Chromium
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: install
        run: npm ci
      - uses: actions/download-artifact@v8
        with:
          name: dist-e2e
          path: dist/
      - name: Playwright の Chromium
        run: npx playwright install --with-deps chromium
      - name: test:e2e
        # BL-073（E2E の基盤）が入るまで、e2e/ は PoC の道具（perf・screens・sdk-live・smoke）で、test:e2e（playwright test）は全部を動かす。
        # perf は CPU 4 倍遅延で 60 秒ずつ計測し、GPU のないランナーでは性能の条件で落ちやすく分数も使うので、そのあいだはスモーク
        # （起動・タップで掘れる・コンソールのエラーなし・外部への通信なし）だけにする。sdk-live（実物の SDK を読む）は PW_DIST がないと skip。
        # BL-073 の後（package.json に test:e2e:nightly がある）は test:e2e（--project=chromium。PoC の道具は設定で除外）。そうなったらこの分岐は消してよい
        # 配信するビルド: web 版を pick-e2e-dist.mjs で選ぶ（dist/e2e-web があればそれ、なければ dist/e2e。どちらもなければここで失敗）。
        #   PoC の playwright.config.ts は PW_DIST（既定 dist/e2e）を配信するので、PoC の分岐では選んだ場所を PW_DIST で渡す。
        #   BL-073 の後は e2e/support/serve.mjs が mode（PW_MODE。既定 e2e）の outDir を配信するので PW_DIST は渡さない
        #   （PW_DIST は mode より優先されるので、渡すと S2 の PW_MODE=e2e-crazygames を上書きしてしまう）
        run: |
          web="$(node scripts/pick-e2e-dist.mjs)"
          echo "::notice::e2e の web 版のビルド: $web"
          if node -e "process.exit(require('./package.json').scripts['test:e2e:nightly'] ? 0 : 1)"; then
            npm run test:e2e
          else
            echo "::notice::PoC の e2e（BL-073 の前）なので e2e/smoke.spec.ts だけを実行する"
            PW_DIST="$web" npx playwright test e2e/smoke.spec.ts
          fi
      - name: 失敗したときの記録を残す
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore

  deploy-preview:
    needs: [verify, e2e]
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && vars.CF_PAGES_PROJECT != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read # deploy/ の lockfile を取る checkout だけに使う
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: deploy
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: deploy/package-lock.json
      - name: wrangler を入れる（deploy/package-lock.json で固定。インストールのスクリプトは動かさず、トークンも渡さない）
        run: npm ci --prefix deploy --ignore-scripts --no-audit --no-fund
      - uses: actions/download-artifact@v8
        with:
          name: dist-web
          path: dist/web/
      - name: Cloudflare Pages（プレビュー https://<branch>.<project>.pages.dev）
        run: |
          # 本番・ステージングの別名と同じ名前、空の名前には出さない（Pages は小文字にし、英数字以外をハイフンにした名前を別名にする）
          lower="$(printf '%s' "$BRANCH" | tr '[:upper:]' '[:lower:]')"
          alias="$(printf '%s' "$lower" | sed -E 's/[^a-z0-9]+/-/g; s/^-+//; s/-+$//')"
          for name in "$lower" "$alias"; do
            case "$name" in
              ''|main|staging|production)
                echo "::error::ブランチ名「$BRANCH」はプレビューに出さない（本番・ステージングの別名と衝突するか、空）"
                exit 1 ;;
            esac
          done
          deploy/node_modules/.bin/wrangler pages deploy dist/web --project-name="$PROJECT" --branch="$BRANCH" --commit-hash="$SHA" --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: 'false'
          PROJECT: ${{ vars.CF_PAGES_PROJECT }}
          BRANCH: ${{ github.head_ref }}
          SHA: ${{ github.event.pull_request.head.sha }}

  deploy-staging:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.CF_PAGES_PROJECT != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read # deploy/ の lockfile を取る checkout だけに使う
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: deploy
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: deploy/package-lock.json
      - name: wrangler を入れる（deploy/package-lock.json で固定。インストールのスクリプトは動かさず、トークンも渡さない）
        run: npm ci --prefix deploy --ignore-scripts --no-audit --no-fund
      - uses: actions/download-artifact@v8
        with:
          name: dist-web
          path: dist/web/
      - name: Cloudflare Pages（ステージング https://staging.<project>.pages.dev。本番ブランチにはしない）
        run: deploy/node_modules/.bin/wrangler pages deploy dist/web --project-name="$PROJECT" --branch=staging --commit-hash="$GITHUB_SHA" --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: 'false'
          PROJECT: ${{ vars.CF_PAGES_PROJECT }}
