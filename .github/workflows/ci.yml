# CI（BL-008・BL-080。infra.md §4-3・付録 A-1 を npm に読み替えたもの）
# - verify: gitleaks → lint → typecheck → test → test:checks → build:all → build:e2e → check:size → check:assets
#   同じジョブの連続した step なので、前が失敗したら後ろは動かない（TS-008-23）
# - e2e: verify が緑のときだけ（needs）。PR と手動実行で動く。main への push では PR で実施済みなので省く
#   verify のビルド（e2e 系 2 種と本番 4 種。成果物 dist-e2e）を受け取り、scripts/check-e2e-dist.mjs でそろっていることを
#   確かめてから npm run test:e2e を流す（BL-095）
# - deploy-preview / deploy-staging: Actions の Variables の CF_PAGES_PROJECT が空のあいだはスキップされる（BL-080 で登録済み）
#   このワークフローは本番ブランチ（main）には決して出さない。本番は release.yml（手動・G3 の後。BL-085）だけ
#   - PR は main をベースにしたものだけ（head が main の PR は同じリポジトリでは作れない）
#   - プレビューは同じリポジトリのブランチからの PR だけ（フォーク・Dependabot には出さない）
#   - プレビューのデプロイの直前に、ブランチ名が 空・main・staging・production（小文字にしたもの、別名にしたもの）なら失敗させる
#   - これらは scripts/check-selftest.mjs（npm run test:checks）が静的に検査する（コードレビュー PR #1 の Must）
# - サプライチェーン: gitleaks は版と SHA256 を固定した CLI を直接使う（第三者のアクションを動かさない）。
#   wrangler は deploy/package-lock.json で固定し、トークンのない step で npm ci --ignore-scripts する
name: ci

on:
  pull_request:
    branches: [main]
    paths-ignore: ['docs/**']
  push:
    branches: [main]
    paths-ignore: ['docs/**']
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # gitleaks が全ブランチの全履歴を走査するため
          persist-credentials: false
      - name: gitleaks（全ブランチの全履歴。-m でマージコミットの差分も見る）
        env:
          GITLEAKS_VERSION: 8.30.1
          # gitleaks_8.30.1_linux_x64.tar.gz の SHA256（公式の gitleaks_8.30.1_checksums.txt と同じ値。2026-09-28 に確認）
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          f="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSLf -o "$RUNNER_TEMP/$f" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$f"
          echo "$GITLEAKS_SHA256  $RUNNER_TEMP/$f" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$f" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --log-opts="--all -m" --redact --no-banner --exit-code 1 .
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: install
        run: npm ci
      - name: lint
        run: npm run lint
      - name: typecheck
        run: npm run typecheck
      - name: test
        run: npm run test
      - name: test:checks（ビルド検査そのもののテスト）
        run: npm run test:checks
      - name: build:all（web・crazygames・itch・poki）
        run: npm run build:all
      - name: build:e2e（テスト用フック入り）
        run: npm run build:e2e
      - name: check:size
        run: npm run check:size
      - name: check:assets
        run: npm run check:assets
      - name: dist/web をデプロイのジョブに渡す
        uses: actions/upload-artifact@v7
        with:
          name: dist-web
          path: dist/web/
          retention-days: 1
          if-no-files-found: error
      - name: e2e 系と本番のビルドを e2e のジョブに渡す
        uses: actions/upload-artifact@v7
        with:
          name: dist-e2e
          # scripts/check-lib.mjs の E2E_JOB_TARGETS と同じ 6 つ（test:checks が一致を検査する）。BL-095
          # - e2e 系: e2e-web（E1・E5・E9 など）・e2e-crazygames（S2 の PW_MODE=e2e-crazygames）
          # - 本番の 4 種: 本番の起動の E2E（BL-097 の TS-007-03・09・13。__game なし）が配信する。dist-web（デプロイ用）とは別に持つ
          #   （デプロイのジョブは今のまま dist-web だけを受け取る）。zip で 2,694,889 バイト（PR #5 の run 36491902871 の実測）
          # どれも dist/ からの相対パスで保存される（パスの共通の親が dist/）。ないものは飛ばされるので、e2e ジョブの check-e2e-dist.mjs で確かめる
          path: |
            dist/e2e-web/
            dist/e2e-crazygames/
            dist/web/
            dist/crazygames/
            dist/itch/
            dist/poki/
          retention-days: 1
          if-no-files-found: error

  e2e:
    needs: verify
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PW_CHANNEL: chromium # Playwright の Chromium（BL-073 から playwright.config.ts の既定も chromium。手元で Chrome を使うときだけ chrome）
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: install
        run: npm ci
      - uses: actions/download-artifact@v8
        with:
          name: dist-e2e
          path: dist/
      - name: 受け取ったビルドの確認（e2e 系 2 種・本番 4 種。欠けていれば Playwright を入れる前に止める）
        run: node scripts/check-e2e-dist.mjs
      - name: Playwright の Chromium
        run: npx playwright install --with-deps chromium
      - name: test:e2e
        # --project=chromium（PoC の道具と @nightly の印のテストは playwright.config.ts で除外）。配信は e2e/support/serve.mjs が
        # mode（既定 e2e）の outDir（dist/e2e-web）を使う。配信先の上書きの環境変数はここでは渡さない（S2 の mode の切り替えを上書きするため）。
        # 本番の起動の E2E（BL-097）は、手元と同じ dist/web・crazygames・itch・poki を読む前提で test:e2e に含める（step を増やさない）。
        # 別の project・スクリプトにする場合は、ここに 1 行足して注記を直す（実行・修復エンジニアと合わせる。BL-095）
        # timeout-minutes はジョブ（20）より短くする: ジョブのタイムアウトで止まると failure() の step も動かず、記録が何も残らない（BL-099）
        timeout-minutes: 15
        run: npm run test:e2e
      # 失敗したときの記録（BL-099。決定 0006-4・QA 判定書 S1 §6-3。nightly.yml も同じ方針）
      # - playwright-report/ だけを 3 日。HTML レポートがトレース・スクリーンショットを自分の中に写すので、原因はこれで追える
      #   （前は test-results/ も一緒に 7 日保存して同じものを 2 回持っていた。1 回 約 168MB。infra.md §4-3「成果物の保存量」）
      # - test-results/ は HTML レポートができなかったとき（playwright-report/index.html がないとき。step のタイムアウトなど）だけ
      # - 失敗の原因（エラーの要約・分類）は、3 日で消える成果物ではなく実行記録（org/30_quality/test-engineer/runs/）に残す
      - name: 失敗したときの記録を残す（HTML レポート）
        if: failure() && hashFiles('playwright-report/index.html') != ''
        uses: actions/upload-artifact@v7
        with:
          name: e2e-report
          path: playwright-report/
          retention-days: 3
          if-no-files-found: ignore
      - name: 失敗したときの記録を残す（HTML レポートができなかったときだけ test-results/）
        if: failure() && hashFiles('playwright-report/index.html') == ''
        uses: actions/upload-artifact@v7
        with:
          name: e2e-test-results
          path: test-results/
          retention-days: 3
          if-no-files-found: ignore

  deploy-preview:
    needs: [verify, e2e]
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && vars.CF_PAGES_PROJECT != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read # deploy/ の lockfile を取る checkout だけに使う
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: deploy
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: deploy/package-lock.json
      - name: wrangler を入れる（deploy/package-lock.json で固定。インストールのスクリプトは動かさず、トークンも渡さない）
        run: npm ci --prefix deploy --ignore-scripts --no-audit --no-fund
      - uses: actions/download-artifact@v8
        with:
          name: dist-web
          path: dist/web/
      - name: Cloudflare Pages（プレビュー https://<branch>.<project>.pages.dev）
        run: |
          # 本番・ステージングの別名と同じ名前、空の名前には出さない（Pages は小文字にし、英数字以外をハイフンにした名前を別名にする）
          lower="$(printf '%s' "$BRANCH" | tr '[:upper:]' '[:lower:]')"
          alias="$(printf '%s' "$lower" | sed -E 's/[^a-z0-9]+/-/g; s/^-+//; s/-+$//')"
          for name in "$lower" "$alias"; do
            case "$name" in
              ''|main|staging|production)
                echo "::error::ブランチ名「$BRANCH」はプレビューに出さない（本番・ステージングの別名と衝突するか、空）"
                exit 1 ;;
            esac
          done
          deploy/node_modules/.bin/wrangler pages deploy dist/web --project-name="$PROJECT" --branch="$BRANCH" --commit-hash="$SHA" --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: 'false'
          PROJECT: ${{ vars.CF_PAGES_PROJECT }}
          BRANCH: ${{ github.head_ref }}
          SHA: ${{ github.event.pull_request.head.sha }}

  deploy-staging:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.CF_PAGES_PROJECT != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read # deploy/ の lockfile を取る checkout だけに使う
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: deploy
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: deploy/package-lock.json
      - name: wrangler を入れる（deploy/package-lock.json で固定。インストールのスクリプトは動かさず、トークンも渡さない）
        run: npm ci --prefix deploy --ignore-scripts --no-audit --no-fund
      - uses: actions/download-artifact@v8
        with:
          name: dist-web
          path: dist/web/
      - name: Cloudflare Pages（ステージング https://staging.<project>.pages.dev。本番ブランチにはしない）
        run: deploy/node_modules/.bin/wrangler pages deploy dist/web --project-name="$PROJECT" --branch=staging --commit-hash="$GITHUB_SHA" --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: 'false'
          PROJECT: ${{ vars.CF_PAGES_PROJECT }}
