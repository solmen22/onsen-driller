# 毎晩のジョブと e2e-full（BL-084。infra.md §4-3、arch §16-4、QA 判定書 S1 §6-2・§6-3、決定 0006-2・4）
#
# ジョブ
#   - e2e-nightly: 毎晩の E2E。npm run test:e2e:nightly（webkit・firefox・mobile-safari・mobile-chrome。@nightly の印を含む全件。
#       --max-failures で失敗の件数に上限。あるブラウザで全体が落ちたときのレポートの大きさと分数を抑える。PR #9 のレビュー S-1）。
#       ジョブ名は ci.yml の e2e と取り違えないように e2e-nightly（PR #9 のレビュー N-1）。
#       手動実行で mode=full を選ぶと npm run test:e2e:full（chromium-full・毎晩の 4 つ・prod-builds。リリース前の e2e-full）。
#       決定 0006-2 で、balance・property（BL-090）を待たずに別のジョブにして S2 の最初に始めた。
#   - balance・property: まだ置かない。BL-090（test:property:full）・BL-033（test:balance の全ボット）がそろってから、
#       このファイルに別のジョブとして足し、手動実行で緑を確かめてから schedule に入れる（BL-084。そろう前に動かすと失敗して分数を使う）。
#       足すときの形: 同じ「前回から変更があるか」→ npm ci → npm run test:balance（レポートは reports/balance/ を 14 日）
#       → npm run test:property:full。E2E のジョブとは needs でつながない（片方の失敗でもう片方を止めない）。
#
# prod-builds（本番 4 ビルドの起動。BL-097）
#   - 毎晩（test:e2e:nightly）には入れない。prod-builds は Chromium だけのプロジェクトで、PR ごとの test:e2e で同じ形のビルドを
#     毎回流している（毎晩に重ねても新しく分かることがない）。
#   - e2e-full（test:e2e:full）には入る。本番 4 種（dist/web・crazygames・itch・poki）が要るので、このジョブは mode にかかわらず
#     build:all もする（手元で数秒。PR #6 のコードレビュー S-3: build:e2e だけだと「dist/web がありません」で必ず落ちる）。
#
# 失敗したときの記録（BL-099 と同じ方針。QA の同意の条件 ③）
#   - playwright-report/ だけを 3 日（HTML レポートがトレース・スクリーンショットを自分の中に写すので、原因はこれで追える）。
#   - test-results/ は HTML レポートができなかったとき（playwright-report/index.html がないとき。step のタイムアウトなど）だけ。
#   - テストの step に timeout-minutes を付ける（ジョブのタイムアウトで止まると failure() の step も動かず、何も残らないため）。
#   - 失敗の原因（エラーの要約・分類）は、3 日で消える成果物ではなく実行記録（org/30_quality/test-engineer/runs/）に残す。
#
# schedule: 週 2 回（月・木の 03:17 JST。CEO 決定 2026-09-28 の 03:00 を、GitHub が混みやすい毎時 0 分から 17 分ずらした。
#   PR #9 のレビュー N-3・CEO 決定）。PR #8（BL-102）のマージの後の手動実行（workflow_dispatch）の結果を報告してから有効にした
#   （決定 0006-2）。前回から main に変更がない回はすぐ終える。結果は CEO がセッションの開始時に gh run list で見る（runbook §7-1）。
# 分数（infra.md §4-3）: 1 回の実測は infra.md。週 2 回で月 約 9 回。
name: nightly

on:
  schedule:
    - cron: '17 18 * * 0,3' # 月・木の 03:17 JST（UTC の日・水 18:17）。毎日にするなら '17 18 * * *'（CEO の判断）
  workflow_dispatch:
    inputs:
      mode:
        description: 'nightly（毎晩と同じ内容）／ full（リリース前の e2e-full。chromium-full と prod-builds を追加）'
        type: choice
        options: [nightly, full]
        default: nightly

concurrency:
  # mode ごとに分け、実行中のものは取り消さない（リリース前に手動で動かした e2e-full を、schedule の実行が止めないように）
  group: nightly-${{ inputs.mode || 'nightly' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  e2e-nightly:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      PW_CHANNEL: chromium # mobile-chrome・chromium-full は Playwright の Chromium（ci.yml の e2e ジョブと同じ）
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 50 # 「前回から変更があるか」を見るため
          persist-credentials: false
      - name: 前回から変更があるか（schedule のときだけ。手動実行は常に動かす）
        id: changed
        run: |
          if [ "$EVENT" != "schedule" ] || [ -n "$(git log -1 --since='4 days ago' --format=%H)" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "main に 4 日間変更がないので省略する" >> "$GITHUB_STEP_SUMMARY"
          fi
        env:
          EVENT: ${{ github.event_name }}
      - if: steps.changed.outputs.run == 'true'
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: install
        if: steps.changed.outputs.run == 'true'
        run: npm ci
      - name: build:all（本番 4 種。e2e-full の prod-builds が使う）
        if: steps.changed.outputs.run == 'true'
        run: npm run build:all
      - name: build:e2e（テスト用フック入り。e2e/support/serve.mjs が dist/e2e-web を配信する）
        if: steps.changed.outputs.run == 'true'
        run: npm run build:e2e
      - name: Playwright のブラウザ（Chromium・WebKit・Firefox）
        if: steps.changed.outputs.run == 'true'
        run: npx playwright install --with-deps chromium webkit firefox
      - name: E2E（webkit・firefox・mobile-safari・mobile-chrome）
        if: steps.changed.outputs.run == 'true' && inputs.mode != 'full'
        # test:e2e は --project=chromium を含む（PR ごとに流している）ので使わない。4 つのプロジェクトは test:e2e:nightly が選ぶ
        timeout-minutes: 40
        run: npm run test:e2e:nightly
      - name: e2e-full（chromium-full・毎晩の 4 つ・prod-builds）
        if: steps.changed.outputs.run == 'true' && inputs.mode == 'full'
        timeout-minutes: 45
        run: npm run test:e2e:full
      - name: 失敗したときの記録を残す（HTML レポート）
        if: failure() && hashFiles('playwright-report/index.html') != ''
        uses: actions/upload-artifact@v7
        with:
          name: nightly-e2e-report
          path: playwright-report/
          retention-days: 3
          if-no-files-found: ignore
      - name: 失敗したときの記録を残す（HTML レポートができなかったときだけ test-results/）
        if: failure() && hashFiles('playwright-report/index.html') == ''
        uses: actions/upload-artifact@v7
        with:
          name: nightly-e2e-test-results
          path: test-results/
          retention-days: 3
          if-no-files-found: ignore
