# 毎晩のジョブと e2e-full（BL-084。infra.md §4-3、arch §16-4、QA 判定書 S1 §6-2・§6-3、決定 0006-2・4）
#
# ジョブ
#   - e2e-nightly: 毎晩の E2E。npm run test:e2e:nightly（webkit・firefox・mobile-safari・mobile-chrome。@nightly の印を含む全件。
#       PW_MAX_FAILURES=25 で失敗の件数に上限〔playwright.config.ts の maxFailures〕。全体が落ちたときのレポートと分数を抑える。PR #9 のレビュー S-1）。
#       ジョブ名は e2e-nightly（PR #9 のレビュー N-1。ci.yml の旧 e2e ジョブ〔今は verify に含まれる〕と取り違えないため）。
#       手動実行で mode=full を選ぶと npm run test:e2e:full（chromium-full・毎晩の 4 つ・prod-builds。リリース前の e2e-full）。
#       決定 0006-2 で、balance・property（BL-090）を待たずに別のジョブにして S2 の最初に始めた。
#   - balance・property: まだ置かない。BL-090（test:property:full）・BL-033（test:balance の全ボット）がそろってから、
#       このファイルに別のジョブとして足し、手動実行で緑を確かめてから schedule に入れる（BL-084。そろう前に動かすと失敗して分数を使う）。
#       足すときの形: 同じ「前回から変更があるか」→ npm ci → npm run test:balance（レポートは reports/balance/ を 14 日）
#       → npm run test:property:full。E2E のジョブとは needs でつながない（片方の失敗でもう片方を止めない）。
#
# prod-builds（本番 4 ビルドの起動。BL-097）
#   - 毎晩（test:e2e:nightly）には入れない。prod-builds は Chromium だけのプロジェクトで、PR ごとの test:e2e で同じ形のビルドを
#     毎回流している（毎晩に重ねても新しく分かることがない）。
#   - e2e-full（test:e2e:full）には入る。本番 4 種（dist/web・crazygames・itch・poki）が要るので、このジョブは mode にかかわらず
#     build:all もする（手元で数秒。PR #6 のコードレビュー S-3: build:e2e だけだと「dist/web がありません」で必ず落ちる）。
#
# 失敗したときの記録（BL-099 と同じ方針。QA の同意の条件 ③）
#   - playwright-report/ だけを 7 日（HTML レポートがトレース・スクリーンショットを自分の中に写すので、原因はこれで追える）。
#   - test-results/ は HTML レポートができなかったとき（playwright-report/index.html がないとき。step のタイムアウトなど）だけ。
#   - 緑の回は playwright-report/results.json だけを 7 日（skip の理由・注記〔TS-035-09 の描画の方式・TS-104-02 の対照など〕は
#     ログの list の行に出ないため。赤の回は HTML レポートの中に results.json が入るので、この step は動かない）。
#   - 保存は 7 日（BL-128）: 非公開の間の schedule は週 2 回（月・木）で、3 日では次の回の前に消えていた（QA の S2 判定書 §2-2 の 5）。
#     公開中（毎日）も 7 日のまま（QA 2026-10-18 §2-1 の条件 4）。
#     保存量への影響は 1 か月で数 MB〜数十 MB・月【推定。infra.md §4-3】。ci.yml の PR の記録は 3 日のまま。
#   - テストの step に timeout-minutes を付ける（ジョブのタイムアウトで止まると failure() の step も動かず、何も残らないため）。
#   - 失敗の原因（エラーの要約・分類）は、7 日で消える成果物ではなく実行記録（org/30_quality/test-engineer/runs/）に残す。
#
# schedule: 公開中は毎日、非公開の間は週 2 回（月・木）。どちらも 03:17 JST（CEO 決定 2026-09-28 の 03:00 を、GitHub が混みやすい
#   毎時 0 分から 17 分ずらした。PR #9 のレビュー N-3）。決定 0010 の 12・QA 2026-10-18 §2-1 の条件 1〜4。
#   - cron は 2 本: 月・木（'17 18 * * 0,3'）と、それ以外の 5 日（'17 18 * * 1,2,4,5,6'）。2 本で毎日になる（重ならない）。
#   - gate ジョブ（scripts/nightly-gate.mjs）が、この回に流すかを決める。手作業は要らない（公開・非公開の切り替えに追従する）:
#     - 月・木以外の回は、リポジトリが公開のときだけ流す。可視性はその回に API で読む（読めなければ非公開として扱う）。
#     - 前回に成功した nightly（E2E まで success の回）の SHA と main の先頭が同じなら流さない（同じ SHA を何度も流さない）。
#       gate だけで終えた回・赤の回は「前回」に数えない。読めないときは流す。
#     - 手動実行（workflow_dispatch）は常に流す。
#   - e2e-nightly は gate の run が true のときだけ動く（false の回は skip。run は success のまま 1 分足らずで終わる）。
#   - gate だけがトークン（github.token。actions: read）を持つ。npm ci もテストのコードも動かさない（スクリプトは node: の組み込みだけ）。
#     e2e-nightly はワークフロー直下の contents: read だけで、トークンを参照しない（PR #9 のレビュー S-3。test:checks が検査する）。
#   結果は CEO がセッションの開始時に gh run list で見る（runbook §7-1）。
# 分数（infra.md §4-3）: 1 回の実測は infra.md。公開中は無料。非公開の間は月・木の最大 約 9 回＋gate だけの回（1 回 1 分の切り上げ）。
name: nightly

on:
  schedule:
    # 2 本の文字列は scripts/nightly-gate.mjs の CRON_TWICE_WEEKLY・CRON_OTHER_DAYS と同じにする（test:checks が検査する）
    - cron: '17 18 * * 0,3' # 月・木の 03:17 JST（UTC の日・水 18:17）。公開・非公開にかかわらず、前回から変更があれば流す
    - cron: '17 18 * * 1,2,4,5,6' # それ以外の 5 日の 03:17 JST。公開中だけ流す（gate が可視性を読む）
  workflow_dispatch:
    inputs:
      mode:
        description: 'nightly（毎晩と同じ内容）／ full（リリース前の e2e-full。chromium-full と prod-builds を追加）'
        type: choice
        options: [nightly, full]
        default: nightly

concurrency:
  # mode ごとに分け、実行中のものは取り消さない（リリース前に手動で動かした e2e-full を、schedule の実行が止めないように）
  group: nightly-${{ inputs.mode || 'nightly' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read # scripts/nightly-gate.mjs を取る checkout
      actions: read # 前回の nightly の run と jobs を読む（可視性の GET /repos は metadata で読める）
    outputs:
      run: ${{ steps.gate.outputs.run }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            scripts/nightly-gate.mjs
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: この回に流すか（公開中は毎日・非公開の間は月・木。前回の成功から main が変わったときだけ）
        id: gate
        # Node はランナーに入っているものを使う（setup-node・npm ci をしない。スクリプトは node: の組み込みだけ）
        run: node scripts/nightly-gate.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          EVENT_PRIVATE: ${{ github.event.repository.private }}

  e2e-nightly:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      PW_CHANNEL: chromium # mobile-chrome・chromium-full は Playwright の Chromium（ci.yml の e2e ジョブと同じ）
      # 再実行を使い切っても落ちたテストが 25 件に達したら止める（playwright.config.ts の maxFailures。PR は 10、手元は上限なし）。
      # あるブラウザで全体が落ちたときのレポートの大きさと分数を抑える（PR #9 のレビュー S-1。件数は実行・修復エンジニアの決定）
      PW_MAX_FAILURES: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: install
        run: npm ci
      - name: build:all（本番 4 種。e2e-full の prod-builds が使う）
        run: npm run build:all
      - name: build:e2e（テスト用フック入り。e2e/support/serve.mjs が dist/e2e-web を配信する）
        run: npm run build:e2e
      - name: Playwright のブラウザ（Chromium・WebKit・Firefox）
        run: npx playwright install --with-deps chromium webkit firefox
      # 次の 2 つの step の名前（「E2E（」「e2e-full（」で始まる）は、gate が「前回の成功」を数えるときに見る（nightly-gate.mjs の E2E_STEP_RE）
      - name: E2E（webkit・firefox・mobile-safari・mobile-chrome）
        if: inputs.mode != 'full'
        # test:e2e は --project=chromium を含む（PR ごとに流している）ので使わない。4 つのプロジェクトは test:e2e:nightly が選ぶ
        timeout-minutes: 40
        run: npm run test:e2e:nightly
      - name: e2e-full（chromium-full・毎晩の 4 つ・prod-builds）
        if: inputs.mode == 'full'
        timeout-minutes: 45
        run: npm run test:e2e:full
      - name: 失敗したときの記録を残す（HTML レポート）
        if: failure() && hashFiles('playwright-report/index.html') != ''
        uses: actions/upload-artifact@v7
        with:
          name: nightly-e2e-report
          path: playwright-report/
          retention-days: 7
          if-no-files-found: ignore
      - name: 失敗したときの記録を残す（HTML レポートができなかったときだけ test-results/）
        if: failure() && hashFiles('playwright-report/index.html') == ''
        uses: actions/upload-artifact@v7
        with:
          name: nightly-e2e-test-results
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore
      - name: 緑の回の注記を残す（playwright-report/results.json だけ。skip の理由・注記を読むため。BL-128）
        uses: actions/upload-artifact@v7
        with:
          name: nightly-e2e-results-json
          path: playwright-report/results.json
          retention-days: 7
          if-no-files-found: error
